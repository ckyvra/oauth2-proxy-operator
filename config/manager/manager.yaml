apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-operator
  namespace: oauth2-proxy-operator-system
  labels:
    app.kubernetes.io/name: oauth2-proxy-operator
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy-operator
    spec:
      serviceAccountName: oauth2-proxy-operator
      containers:
      - name: operator
        image: ghcr.io/ckyvra/oauth2-proxy-operator:latest
        args:
        - --leader-elect=true
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8080
        ports:
        - containerPort: 8080
          name: metrics
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi
