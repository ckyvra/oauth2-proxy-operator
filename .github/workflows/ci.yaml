name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true

    - name: Install envtest
      run: |
        go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
        setup-envtest use 1.31.x

    - name: Run tests
      run: make test

    - name: Build binary
      run: make build

  trivy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true

    - name: Build Docker image
      run: docker build -t oauth2-proxy-operator:test .

    - name: Trivy scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: oauth2-proxy-operator:test
        format: table
        exit-code: 1
        severity: HIGH,CRITICAL

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest

  e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true

    - name: Write Kind config
      run: |
        cat <<EOF > /tmp/kind-config.yaml
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        nodes:
        - role: control-plane
          extraPortMappings:
          - containerPort: 80
            hostPort: 80
          - containerPort: 443
            hostPort: 443
        EOF

    - name: Create Kind cluster
      uses: helm/kind-action@v1
      with:
        cluster_name: oauth2-proxy-operator
        config: /tmp/kind-config.yaml

    - name: Install Helm
      uses: azure/setup-helm@v4

    - name: Install Traefik
      run: |
        helm repo add traefik https://traefik.github.io/charts
        helm repo update
        cat <<EOF > /tmp/traefik-values.yaml
        ports:
          web:
            hostPort: 80
          websecure:
            hostPort: 443
        providers:
          kubernetesIngress:
            publishedService:
              enabled: true
        EOF
        helm install traefik traefik/traefik -n traefik --create-namespace -f /tmp/traefik-values.yaml
        kubectl wait -n traefik deployment/traefik --for=condition=Available --timeout=120s

    - name: Install the CRD
      run: kubectl apply -f config/crd/oauth2proxy.kyvrakidis.com_oauth2proxies.yaml

    - name: Create test namespace and secret
      run: |
        kubectl create namespace test-operator
        kubectl create secret generic oauth2-proxy-secret \
          -n test-operator \
          --from-literal=client-secret=test-secret

    - name: Build and run the operator
      run: |
        go build -o /tmp/manager main.go
        /tmp/manager --leader-elect=false --metrics-bind-address=:9090 --zap-log-level=debug > /tmp/operator.log 2>&1 &
        sleep 5
        if ! kill -0 $! 2>/dev/null; then
          echo "Operator failed to start:"
          cat /tmp/operator.log
          exit 1
        fi
        echo "Operator started (PID $!)"

    - name: Create an OAuth2Proxy resource
      run: |
        cat <<EOF | kubectl apply -f -
        apiVersion: oauth2proxy.kyvrakidis.com/v1alpha1
        kind: OAuth2Proxy
        metadata:
          name: test-proxy
          namespace: test-operator
        spec:
          upstream: http://my-app:8080
          clientId: my-client
          clientSecret:
            name: oauth2-proxy-secret
          realm: my-realm
          issuer: https://keycloak.example.com/realms/my-realm
          role: viewer
          replicas: 1
          ingress:
            enabled: true
            host: auth.example.com
            ingressClassName: traefik
        EOF

    - name: Debug — list all resources
      run: |
        echo "--- Deployments ---"
        kubectl get deployments -n test-operator -o wide 2>&1 || true
        echo "--- Services ---"
        kubectl get services -n test-operator -o wide 2>&1 || true
        echo "--- Ingresses ---"
        kubectl get ingresses -n test-operator -o wide 2>&1 || true
        echo "--- OAuth2Proxy ---"
        kubectl get oauth2proxies -n test-operator -o yaml 2>&1 || true

    - name: Wait for Deployment and verify spec
      run: |
        for i in $(seq 1 12); do
          if kubectl get -n test-operator deployment/test-proxy &>/dev/null; then
            echo "Deployment found after ${i}s"
            break
          fi
          echo "Waiting... ${i}s"
          sleep 5
        done
        kubectl get -n test-operator deployment/test-proxy -o yaml || {
          echo "--- Operator logs ---"
          cat /tmp/operator.log
          echo "--- CR status ---"
          kubectl get -n test-operator oauth2proxy/test-proxy -o yaml
          exit 1
        }

    - name: Verify Service
      run: |
        kubectl get -n test-operator service/test-proxy -o yaml

    - name: Verify Ingress
      run: |
        kubectl get -n test-operator ingress/test-proxy -o yaml

    - name: Verify oauth2-proxy args
      run: |
        kubectl get -n test-operator deployment/test-proxy -o jsonpath='{.spec.template.spec.containers[0].args}' | \
          grep -q -- "--provider=oidc" && echo "provider OK"
        kubectl get -n test-operator deployment/test-proxy -o jsonpath='{.spec.template.spec.containers[0].args}' | \
          grep -q -- "--allowed-role=viewer" && echo "role OK"

    - name: Verify Ingress routes to the correct Service
      run: |
        INGRESS_SVC=$(kubectl get -n test-operator ingress/test-proxy \
          -o jsonpath='{.spec.rules[0].http.paths[0].backend.service.name}')
        [ "$INGRESS_SVC" = "test-proxy" ] && echo "Ingress routes to test-proxy service"

    - name: Cleanup
      run: kill %1 || true
